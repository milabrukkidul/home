<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub</title>
    <link id="favicon" rel="icon" type="image/png" href="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300">
    <style>
        /* ===== SUPERMAN LOADER ===== */
        #superman-loader {
            position: fixed;
            inset: 0;
            background-color: #FF7200;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #superman-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #superman-loader .loader-body {
            position: relative;
            animation: speeder 0.4s linear infinite;
        }

        #superman-loader .loader-body > span {
            height: 5px;
            width: 35px;
            background: #000;
            position: absolute;
            top: -19px;
            left: 60px;
            border-radius: 2px 10px 1px 0;
        }

        #superman-loader .loader-body > span > span:nth-child(1),
        #superman-loader .loader-body > span > span:nth-child(2),
        #superman-loader .loader-body > span > span:nth-child(3),
        #superman-loader .loader-body > span > span:nth-child(4) {
            width: 30px;
            height: 1px;
            background: #000;
            position: absolute;
            animation: fazer1 0.2s linear infinite;
        }

        #superman-loader .loader-body > span > span:nth-child(2) {
            top: 3px;
            animation: fazer2 0.4s linear infinite;
        }

        #superman-loader .loader-body > span > span:nth-child(3) {
            top: 1px;
            animation: fazer3 0.4s linear infinite;
            animation-delay: -1s;
        }

        #superman-loader .loader-body > span > span:nth-child(4) {
            top: 4px;
            animation: fazer4 1s linear infinite;
            animation-delay: -1s;
        }

        #superman-loader .base span {
            position: absolute;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-right: 100px solid #000;
            border-bottom: 6px solid transparent;
        }

        #superman-loader .base span::before {
            content: "";
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #000;
            position: absolute;
            right: -110px;
            top: -16px;
        }

        #superman-loader .base span::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-top: 0 solid transparent;
            border-right: 55px solid #000;
            border-bottom: 16px solid transparent;
            top: -16px;
            right: -98px;
        }

        #superman-loader .face {
            position: absolute;
            height: 12px;
            width: 20px;
            background: #000;
            border-radius: 20px 20px 0 0;
            transform: rotate(-40deg);
            right: -125px;
            top: -15px;
        }

        #superman-loader .face::after {
            content: "";
            height: 12px;
            width: 12px;
            background: #000;
            right: 4px;
            top: 7px;
            position: absolute;
            transform: rotate(40deg);
            transform-origin: 50% 50%;
            border-radius: 0 0 0 2px;
        }

        #superman-loader .loader-label {
            position: absolute;
            bottom: calc(50% - 60px);
            left: 50%;
            transform: translateX(-50%);
            font-family: "Open Sans", sans-serif;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            color: #000;
            white-space: nowrap;
        }

        #superman-loader .longfazers {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        #superman-loader .longfazers span {
            position: absolute;
            height: 2px;
            width: 20%;
            background: #000;
        }

        #superman-loader .longfazers span:nth-child(1) {
            top: 20%;
            animation: lf 0.6s linear infinite;
            animation-delay: -5s;
        }

        #superman-loader .longfazers span:nth-child(2) {
            top: 40%;
            animation: lf2 0.8s linear infinite;
            animation-delay: -1s;
        }

        #superman-loader .longfazers span:nth-child(3) {
            top: 60%;
            animation: lf3 0.6s linear infinite;
        }

        #superman-loader .longfazers span:nth-child(4) {
            top: 80%;
            animation: lf4 0.5s linear infinite;
            animation-delay: -3s;
        }

        @keyframes speeder {
            0%   { transform: translate(2px, 1px) rotate(0deg); }
            10%  { transform: translate(-1px, -3px) rotate(-1deg); }
            20%  { transform: translate(-2px, 0px) rotate(1deg); }
            30%  { transform: translate(1px, 2px) rotate(0deg); }
            40%  { transform: translate(1px, -1px) rotate(1deg); }
            50%  { transform: translate(-1px, 3px) rotate(-1deg); }
            60%  { transform: translate(-1px, 1px) rotate(0deg); }
            70%  { transform: translate(3px, 1px) rotate(-1deg); }
            80%  { transform: translate(-2px, -1px) rotate(1deg); }
            90%  { transform: translate(2px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes fazer1 {
            0%   { left: 0; }
            100% { left: -80px; opacity: 0; }
        }

        @keyframes fazer2 {
            0%   { left: 0; }
            100% { left: -100px; opacity: 0; }
        }

        @keyframes fazer3 {
            0%   { left: 0; }
            100% { left: -50px; opacity: 0; }
        }

        @keyframes fazer4 {
            0%   { left: 0; }
            100% { left: -150px; opacity: 0; }
        }

        @keyframes lf {
            0%   { left: 200%; }
            100% { left: -200%; opacity: 0; }
        }

        @keyframes lf2 {
            0%   { left: 200%; }
            100% { left: -200%; opacity: 0; }
        }

        @keyframes lf3 {
            0%   { left: 200%; }
            100% { left: -100%; opacity: 0; }
        }

        @keyframes lf4 {
            0%   { left: 200%; }
            100% { left: -100%; opacity: 0; }
        }
        /* ===== END SUPERMAN LOADER ===== */
    </style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e94560;
            line-height: 1.6;
        }

        /* Animated background orbs */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(233,69,96,0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(83,52,131,0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== SIDEBAR ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: rgba(15,22,48,0.98);
            backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255,255,255,0.08);
            z-index: 300;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            position: sticky;
            top: 0;
            background: rgba(15,22,48,0.98);
            z-index: 1;
        }

        .sidebar-header .sidebar-logo {
            display: flex;
            align-items: center;
        }

        .sidebar-header .sidebar-logo img {
            max-height: 36px;
            width: auto;
        }

        .sidebar-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            line-height: 1;
        }

        .sidebar-close:hover {
            color: #e94560;
            background: rgba(233,69,96,0.1);
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            list-style: none;
        }

        /* Sidebar nav item */
        .sidebar-nav > li {
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .sidebar-nav > li:last-child {
            border-bottom: none;
        }

        .sidebar-nav-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.5rem;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .sidebar-nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .sidebar-nav-link.active-parent {
            color: #e94560;
        }

        .sidebar-nav-link .nav-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .sidebar-chevron {
            font-size: 0.75rem;
            opacity: 0.5;
            transition: transform 0.3s ease;
        }

        .sidebar-chevron.rotated {
            transform: rotate(180deg);
            opacity: 1;
        }

        /* Submenu inside sidebar */
        .sidebar-submenu {
            list-style: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            background: rgba(0,0,0,0.15);
        }

        .sidebar-submenu.open {
            max-height: 500px;
        }

        .sidebar-submenu li a {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.7rem 1.5rem 0.7rem 2.2rem;
            color: rgba(255,255,255,0.55);
            text-decoration: none;
            font-size: 0.88rem;
            transition: all 0.2s;
        }

        .sidebar-submenu li a:hover {
            color: #e94560;
            background: rgba(233,69,96,0.06);
        }

        .sidebar-submenu li a i {
            width: 16px;
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* ===== HEADER ===== */
        header {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        .logo img {
            max-height: 40px;
            width: auto;
            display: block;
        }

        /* Hamburger toggle — visible on all screen sizes */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
            z-index: 101;
            background: none;
            border: none;
        }

        .menu-toggle span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: rgba(255,255,255,0.8);
            transition: 0.3s;
            border-radius: 2px;
        }

        .menu-toggle:hover span {
            background-color: #e94560;
        }

        /* ===== MAIN CONTENT ===== */
        main {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.5rem 2rem;
            text-align: center;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: -0.25rem;
            letter-spacing: -1.5px;
        }

        .hero-title span {
            background: linear-gradient(135deg, #006f43, #028d08, #dafe57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.55);
            margin-bottom: 1.5rem;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== FOOTER ===== */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
        }

        footer p {
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            font-weight: 400;
        }

        /* ===== ICONS GRID ===== */
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .icon-card {
            --hover-color: #e94560;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .icon-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }

        .icon-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255,255,255,0.06);
            border-color: var(--hover-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 60px rgba(0,0,0,0.2);
        }

        .icon-card i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: rgba(255,255,255,0.7);
            transition: all 0.35s;
        }

        .icon-card:hover i {
            color: var(--hover-color);
            transform: scale(1.1);
        }

        .icon-card h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.35rem;
        }

        .icon-card p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }

            .hero-subtitle {
                font-size: 0.8rem;
            }

            .icons-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            main {
                padding: 1rem 1.25rem;
            }

            header {
                padding: 1rem 1.25rem;
            }

            .sidebar {
                width: 100%;
                max-width: 320px;
            }
        }

        @media (max-width: 400px) {
            .icons-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ===== SUPERMAN LOADER ===== -->
    <div id="superman-loader" role="status" aria-label="Memuat halaman">
        <div class="longfazers">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="loader-body">
            <span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </span>
            <div class="base">
                <span></span>
                <div class="face"></div>
            </div>
        </div>
        <p class="loader-label">o te weee... hayaww...</p>
    </div>
    <!-- ===== END SUPERMAN LOADER ===== -->

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menu navigasi">
        <div class="sidebar-header">
            <div class="sidebar-logo" id="sidebarLogo"></div>
            <button class="sidebar-close" onclick="closeSidebar()" aria-label="Tutup menu">&#10005;</button>
        </div>
        <ul class="sidebar-nav" id="sidebarNav"></ul>
    </aside>

    <header>
        <div class="nav-container">
            <button class="menu-toggle" onclick="openSidebar()" aria-label="Buka menu navigasi">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="logo" id="siteLogo">SocialHub</div>
        </div>
    </header>

    <main>
        <h1 class="hero-title" id="heroTitle">Your <span>Social Hub</span></h1>
        <p class="hero-subtitle" id="heroSubtitle">Connect with us across the digital universe. All your favorite platforms in one place.</p>

        <div class="icons-grid" id="iconsGrid"></div>
    </main>

    <footer>
        <p>&copy; 2026 Tim Programmer MI Nurul Islam Labruk Kidul. All Rights Reserved.</p>
    </footer>

    <script src="data.js"></script>
    <script>
        function loadData() {
            if (typeof siteData !== 'undefined') {
                renderPage(siteData);
            } else {
                console.error('data.js not loaded');
            }
        }

        function renderPage(data) {
            // Site title, logo & favicon
            if (data.siteTitle) document.title = data.siteTitle;

            const faviconEl = document.getElementById('favicon');
            if (data.favicon) {
                faviconEl.href = data.favicon;
            } else if (data.logoImage) {
                faviconEl.href = data.logoImage;
            }

            // Header logo
            const logoEl = document.getElementById('siteLogo');
            if (data.logoImage) {
                logoEl.innerHTML = `<img src="${data.logoImage}" alt="${data.siteTitle || 'Logo'}">`;
            } else if (data.siteTitle) {
                logoEl.textContent = data.siteTitle;
            }

            // Sidebar logo (same as header)
            const sidebarLogoEl = document.getElementById('sidebarLogo');
            if (data.logoImage) {
                sidebarLogoEl.innerHTML = `<img src="${data.logoImage}" alt="${data.siteTitle || 'Logo'}">`;
            } else if (data.siteTitle) {
                sidebarLogoEl.textContent = data.siteTitle;
            }

            // Hero
            if (data.heroTitle) document.getElementById('heroTitle').innerHTML = data.heroTitle;
            if (data.heroSubtitle) document.getElementById('heroSubtitle').innerHTML = data.heroSubtitle;

            // Sidebar nav
            const sidebarNav = document.getElementById('sidebarNav');
            sidebarNav.innerHTML = '';

            (data.nav || []).forEach((item, index) => {
                const li = document.createElement('li');

                if (item.dropdown && item.dropdown.length > 0) {
                    li.innerHTML = `
                        <button class="sidebar-nav-link" onclick="toggleSubmenu(${index})" aria-expanded="false" aria-controls="submenu-${index}">
                            <span class="nav-label">${item.name}</span>
                            <span class="sidebar-chevron" id="chevron-${index}">&#9660;</span>
                        </button>
                        <ul class="sidebar-submenu" id="submenu-${index}" role="list">
                            ${item.dropdown.map(sub => `
                                <li>
                                    <a href="${sub.link}" onclick="closeSidebar()">
                                        ${sub.iconClass ? `<i class="${sub.iconClass}" aria-hidden="true"></i>` : ''}
                                        ${sub.name}
                                    </a>
                                </li>
                            `).join('')}
                        </ul>
                    `;
                } else {
                    li.innerHTML = `
                        <a href="${item.link}" class="sidebar-nav-link" onclick="closeSidebar()">
                            <span class="nav-label">${item.name}</span>
                        </a>
                    `;
                }
                sidebarNav.appendChild(li);
            });

            // Icons grid
            const iconsGrid = document.getElementById('iconsGrid');
            iconsGrid.innerHTML = '';
            (data.icons || []).forEach(icon => {
                const card = document.createElement('a');
                card.href = icon.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.className = 'icon-card';
                card.style.setProperty('--hover-color', icon.color || '#e94560');
                card.innerHTML = `
                    <i class="${icon.iconClass}" aria-hidden="true"></i>
                    <h3>${icon.name}</h3>
                    <p>${icon.domain || new URL(icon.url).hostname.replace('www.', '')}</p>
                `;
                iconsGrid.appendChild(card);
            });
        }

        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function toggleSubmenu(index) {
            const submenu = document.getElementById('submenu-' + index);
            const chevron = document.getElementById('chevron-' + index);
            const btn = submenu.previousElementSibling;
            const isOpen = submenu.classList.toggle('open');
            chevron.classList.toggle('rotated', isOpen);
            btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        }

        // Close sidebar on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeSidebar();
        });

        // Hide superman loader when page is ready
        window.addEventListener('load', function() {
            const loader = document.getElementById('superman-loader');
            loader.classList.add('hidden');
            setTimeout(function() {
                loader.style.display = 'none';
            }, 500);
        });

        loadData();
    </script>
</body>
</html>
